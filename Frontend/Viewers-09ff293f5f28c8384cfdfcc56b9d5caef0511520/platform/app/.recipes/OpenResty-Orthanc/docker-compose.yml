# Reference:
# - https://docs.docker.com/compose/compose-file
# - https://eclipsesource.com/blogs/2018/01/11/authenticating-reverse-proxy-with-keycloak/

version: '3.5'

services:
  # Exposed server that's handling incoming web requests
  # Underlying image: openresty/openresty:alpine-fat
  ohif_viewer:
    build:
      # Project root
      context: ./../../../../
      # Relative to context
      dockerfile: ./platform/app/.recipes/OpenResty-Orthanc/dockerfile
    image: webapp:latest
    container_name: webapp
    volumes:
      # Nginx config
      - ./config/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      # Logs
      - ./logs/nginx:/var/logs/nginx
      # Let's Encrypt
      # - letsencrypt_certificates:/etc/letsencrypt
      # - letsencrypt_challenges:/var/www/letsencrypt
    ports:
      - '443:443' # SSL
      - '80:80' # Web
    depends_on:
      - orthanc
      - postgres
    restart: on-failure

  # LINK: https://hub.docker.com/r/jodogne/orthanc-plugins/
  # TODO: Update to use Postgres
  # https://github.com/mrts/docker-postgresql-multiple-databases
  orthanc:
    image: jodogne/orthanc-plugins
    hostname: orthanc
    container_name: orthanc
    ports:
      - 8043:8042
    volumes:
      # Config
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      # Persist data
      - ./volumes/orthanc-db/:/var/lib/orthanc/db/
    restart: unless-stopped
  monailabel:
    image: projectmonai/monailabel:0.8.5
    container_name: monailabel
    runtime: nvidia
    ports:
      - '8000:8000'
    volumes:
      - ./apps:/apps
      - ./monailabel:/usr/local/lib/python3.10/dist-packages/monailabel

    environment:
      - nnUNet_preprocessed=/apps/radiology/nnunet/nnUNet_preprocessed
      - nnUNet_results=/apps/radiology/nnunet/nnUNet_results
      - nnUNet_raw=/apps/radiology/nnunet/nnUNet_raw
      - DATABASE_URL=postgresql://workflow_user:password@postgres:5432/workflow_db
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MONAI_SERVER_PORT=8000

    command: >
      /bin/bash -c "pip install --upgrade pip &&
      pip install batchgenerators &&
      pip install acvl-utils &&
      pip install asyncpg &&
      pip install nnunetv2 &&
      pip install pydicom==2.4.4 &&
      monailabel start_server --app /apps/radiology --studies http://orthanc:8042/dicom-web --conf models all"
    depends_on:
      - orthanc
      - postgres
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    image: postgres
    container_name: postgres
    volumes:
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
      - postgres-db:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: password
    restart: unless-stopped

volumes:
  postgres-db:
