<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="theme-color"
      content="#000000"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="application-name"
      content="CUBE AI"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="@ohif/app"
    />
    <meta
      name="msapplication-TileColor"
      content="#fff"
    />
    <meta
      name="msapplication-TileImage"
      content="<%= PUBLIC_URL %>assets/mstile-144x144.png"
    />
    <meta
      name="msapplication-config"
      content="<%= PUBLIC_URL %>assets/browserconfig.xml"
    />
    <script type="text/javascript">
      console.time('scriptToView');
      window.PUBLIC_URL = '<%= PUBLIC_URL %>';
    </script>
    <link
      rel="manifest"
      href="<%= PUBLIC_URL %>manifest.json"
    />

    <link
      rel="shortcut icon"
      type="image/png"
      href="<%= PUBLIC_URL %>assets/icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      href="<%= PUBLIC_URL %>assets/icon.png"
    />

    <link
      rel="yandex-tableau-widget"
      href="<%= PUBLIC_URL %>assets/yandex-browser-manifest.json"
    />

    <!-- Built with: https://polyfill.io/v3/url-builder/ -->
    <!-- Targets IE11 -->
    <!-- <script
    src="https://polyfill.io/v3/polyfill.min.js?flags=gated&features=default%2CObject.values%2CArray.prototype.flat%2CObject.entries%2CSymbol%2CArray.prototype.includes%2CString.prototype.repeat%2CArray.prototype.find"></script>!-->
    <script
      rel="preload"
      as="script"
      type="text/javascript"
      src="<%= PUBLIC_URL %>app-config.js"
    ></script>
    <script
      rel="preload"
      as="script"
      type="module"
      src="<%= PUBLIC_URL %>init-service-worker.js"
    ></script>

    <title>CUBE AI</title>

    <!-- WEB FONTS -->
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css?family=Inter:100,300,400,500,700&display=swap"
      rel="stylesheet"
      rel="preload"
      as="style"
    />

    <!-- EXTENSIONS -->
    <!-- <script type="text/javascript" src="path/to/some-extension.js"></script>

    <script>
      // If configuration file is a JS Object:
      window.config.extensions = [SomeExtension];

      // If configuration file is a JS Function:
      window.config = () => {
        return {
          extensions: [SomeExtension]
        };
      };
    </script> -->
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>

    <div id="root"></div>
  </body>
</html>
