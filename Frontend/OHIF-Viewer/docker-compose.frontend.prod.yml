name: CUBE.AI
services:
  ohif_viewer:
    image: cubeai1/webapp:v1.0
    container_name: webapp
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Frontend/OHIF-Viewer/platform/app/.recipes/OpenResty-Orthanc/config/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ${COMPOSE_PROJECT_DIR}/Frontend/OHIF-Viewer/platform/app/.recipes/OpenResty-Orthanc/logs/nginx:/var/logs/nginx
    ports:
      - '443:443'
      - '80:80'
    depends_on:
      - orthanc
      - postgres
    restart: on-failure