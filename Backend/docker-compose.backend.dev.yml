
name: CUBE.AI
services:
  monailabel:
    environment:
      MONAI_LABEL_APP_DIR: /apps/radiology
      MONAI_LABEL_APP_CONF: |
        {"models": "all"}
      MONAI_SERVER_PORT: 8000
      MONAI_LABEL_STUDIES: http://orthanc:8042/dicom-web
      MONAI_LABEL_RELOAD: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORTHANC_URL: http://orthanc:8042
      MODELS_DIR: /models
      NNUNET_DIR: /NN_Unet
      GENERAL_DATA_DIR: /General_Data
    command: >-
      sh -c "pip install --no-cache-dir -U torchvision --no-deps &&
      alembic -c /alembic/alembic.ini upgrade head &&
      if [ ! -f /models/voxtell_v1.1/text_embeddings_cache.pkl ]; then python /apps/radiology/caching_generator.py; fi &&
      python /monailabel/server_start.py"
    env_file:
      - .env

