name: CUBE.AI
services:
  agents:
    image: cubeai1/agents-app:latest
    container_name: agents-backend
    ports:
      - '8150:8150'
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/storage:/storage
      - ${COMPOSE_PROJECT_DIR}/Backend/storage_paths.py:/app/Backend/storage_paths.py:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/agent_system:/app/Backend/agent_system
      - ${COMPOSE_PROJECT_DIR}/Backend/mcp:/app/Backend/mcp
      - ${COMPOSE_PROJECT_DIR}/Backend/apps/radiology/lib/configs:/app/Backend/apps/radiology/lib/configs:ro
    environment:
      BACKEND_STORAGE_ROOT: /storage
      AGENTS_WORKSPACE_DIR: /storage/hypotheses
      GENERAL_DATA_DIR: /storage/data/medical
      NNUNET_DIR: /storage/data/nnunet
      nnUnet_folders: /storage/data/nnunet
      MODELS_DIR: /storage/models
      INFERENCE_JOB_DIR: /storage/jobs/inference
      HF_HOME: /storage/cache/huggingface
      BACKEND_TEMP_DIR: /storage/temp
      BACKEND_LOG_DIR: /storage/logs
      TMPDIR: /storage/temp/radiology
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      MONAI_URL: http://monailabel:8000
      CONTROL_API_URL: http://control-api:8001
      ORTHANC_URL: http://orthanc:8042
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      monailabel:
        condition: service_healthy
      control-api:
        condition: service_healthy
    restart: unless-stopped

  control-api:
    image: cubeai1/custom-monailabel:v1.0-cpu
    container_name: control-api-backend
    command: python /monailabel/control_server_start.py
    ports:
      - '8001:8001'
    environment:
      CONTROL_API_PORT: 8001
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKEND_STORAGE_ROOT: /storage
      AGENTS_WORKSPACE_DIR: /storage/hypotheses
      GENERAL_DATA_DIR: /storage/data/medical
      NNUNET_DIR: /storage/data/nnunet
      nnUnet_folders: /storage/data/nnunet
      MODELS_DIR: /storage/models
      INFERENCE_JOB_DIR: /storage/jobs/inference
      HF_HOME: /storage/cache/huggingface
      BACKEND_TEMP_DIR: /storage/temp
      BACKEND_LOG_DIR: /storage/logs
      TMPDIR: /storage/temp/radiology
    env_file:
      - .env
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/storage:/storage
      - ${COMPOSE_PROJECT_DIR}/Backend/storage_paths.py:/apps/radiology/storage_paths.py:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/monailabel:/monailabel
    depends_on:
      postgres:
        condition: service_healthy
      monailabel:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8001/health", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  monailabel:
    # CPU image — multi-arch (arm64 + amd64), no CUDA
    image: cubeai1/custom-monailabel:v1.0-cpu
    container_name: monailabel-backend
    shm_size: 8G
    ports:
      - '8000:8000'
    environment:
      MONAI_LABEL_APP_DIR: /apps/radiology
      MONAI_LABEL_APP_CONF: |
        {"models": "all"}
      MONAI_SERVER_PORT: 8000
      MONAI_LABEL_STUDIES: http://orthanc:8042/dicom-web
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORTHANC_URL: http://orthanc:8042
      BACKEND_STORAGE_ROOT: /storage
      AGENTS_WORKSPACE_DIR: /storage/hypotheses
      GENERAL_DATA_DIR: /storage/data/medical
      NNUNET_DIR: /storage/data/nnunet
      nnUnet_folders: /storage/data/nnunet
      MODELS_DIR: /storage/models
      INFERENCE_JOB_DIR: /storage/jobs/inference
      HF_HOME: /storage/cache/huggingface
      BACKEND_TEMP_DIR: /storage/temp
      BACKEND_LOG_DIR: /storage/logs
      TMPDIR: /storage/temp/radiology
      TEXT_MODEL_PATH: /storage/models/qwen3-4b-embedding
      VOXTELL_DIR: /storage/models/voxtell_v1.1
      VISTA_CONFIG_SOURCE_DIR: /config/vista
      nnUNet_raw: /storage/data/nnunet/nnUNet_raw
      nnUNet_preprocessed: /storage/data/nnunet/nnUNet_preprocessed
      nnUNet_results: /storage/data/nnunet/nnUNet_results
      PATH: "/apps/radiology/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    env_file:
      - .env
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/apps:/apps
      - ${COMPOSE_PROJECT_DIR}/Backend/monailabel:/monailabel
      - ${COMPOSE_PROJECT_DIR}/Backend/storage:/storage
      - ${COMPOSE_PROJECT_DIR}/Backend/models/configs/vista:/config/vista:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/storage_paths.py:/apps/radiology/storage_paths.py:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/CustomNnUnetTrainer.py:/usr/local/lib/python3.10/dist-packages/nnunetv2/training/nnUNetTrainer/CustomNnUnetTrainer.py
      - ${COMPOSE_PROJECT_DIR}/Backend/alembic.ini:/alembic/alembic.ini
      - ${COMPOSE_PROJECT_DIR}/Backend/migrations:/alembic/migrations
    # CMD in the Dockerfile.gpu already runs migrations + server.
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_started
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/info/", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  orthanc:
    image: jodogne/orthanc-plugins
    hostname: orthanc
    container_name: orthanc-backend
    ports:
      - 8043:8042
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/orthanc/lua:/etc/orthanc/lua
      - orthanc-db:/var/lib/orthanc/db/
    restart: unless-stopped

  postgres:
    image: postgres:18rc1-alpine3.22
    container_name: postgres-backend
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/backup.sql:/docker-entrypoint-initdb.d/backup.sql
      - postgres-db:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-db:
  orthanc-db:
