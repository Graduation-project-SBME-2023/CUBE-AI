name: CUBE.AI
services:
  monailabel:
#    build:
#      context: ${COMPOSE_PROJECT_DIR}/Backend/
#      dockerfile: ${COMPOSE_PROJECT_DIR}/Backend/Dockerfile
    image: cubeai1/custom-monailabel:0.2
    container_name: monailabel-backend
    shm_size: 8G # change if needed
    ports:
      - '8000:8000'
    environment:
      MONAI_LABEL_APP_DIR: /apps/radiology
      MONAI_LABEL_APP_CONF: |
        {"models": "all"}
      MONAI_SERVER_PORT: 8000
      MONAI_LABEL_STUDIES: http://orthanc:8042/dicom-web
      DATABASE_URL: postgresql://workflow_user:password@postgres:5432/workflow_db
      MODELS_DIR: /models
      NNUNET_DIR: /NN_Unet
      GENERAL_DATA_DIR: /General_Data
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/apps:/apps
      - ${COMPOSE_PROJECT_DIR}/Backend/monailabel:/monailabel
      - ${COMPOSE_PROJECT_DIR}/Backend/models:/models
      - nnUnet_folders:/NN_Unet
      - General_Data:/General_Data
      - ${COMPOSE_PROJECT_DIR}/Backend/CustomNnUnetTrainer.py:/usr/local/lib/python3.10/dist-packages/nnunetv2/training/nnUNetTrainer/CustomNnUnetTrainer.py
    command: ["python", "/monailabel/server_start.py"]
    depends_on:
      - postgres
      - orthanc

  orthanc:
    image: jodogne/orthanc-plugins
    hostname: orthanc
    container_name: orthanc-backend
    ports:
      - 8043:8042
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-db:/var/lib/orthanc/db/
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: postgres-backend
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/backup.sql:/docker-entrypoint-initdb.d/backup.sql
      - postgres-db:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: password
    restart: unless-stopped

volumes:
  postgres-db:
  orthanc-db:
  nnUnet_folders:
  General_Data:
