name: CUBE.AI
services:
  agents:
    image: cubeai1/agents-app:latest
    container_name: agents-backend
    ports:
      - '8150:8150'
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/agents_workspace:/app/agents_workspace
      - ${COMPOSE_PROJECT_DIR}/Backend/agent_system:/app/Backend/agent_system
      - ${COMPOSE_PROJECT_DIR}/Backend/mcp:/app/Backend/mcp
    environment:
      AGENTS_WORKSPACE_DIR: /app/agents_workspace
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      MONAI_URL: http://monailabel:8000
    depends_on:
      - postgres
      - monailabel
    restart: unless-stopped

  monailabel:
#    build:
#      context: ${COMPOSE_PROJECT_DIR}/Backend/
#      dockerfile: ${COMPOSE_PROJECT_DIR}/Backend/Dockerfile
    image: cubeai1/custom-monailabel:0.2
    container_name: monailabel-backend
    shm_size: 8G # change if needed
    ports:
      - '8000:8000'
    environment:
      MONAI_LABEL_APP_DIR: /apps/radiology
      MONAI_LABEL_APP_CONF: |
        {"models": "all"}
      MONAI_SERVER_PORT: 8000
      MONAI_LABEL_STUDIES: http://orthanc:8042/dicom-web
      DATABASE_URL: postgresql+asyncpg://workflow_user:password@postgres:5432/workflow_db
      MODELS_DIR: /models
      NNUNET_DIR: /NN_Unet
      GENERAL_DATA_DIR: /General_Data
      PATH: "/apps/radiology/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/apps:/apps
      - ${COMPOSE_PROJECT_DIR}/Backend/monailabel:/monailabel
      - ${COMPOSE_PROJECT_DIR}/Backend/models:/models
      - nnUnet_folders:/NN_Unet
      - General_Data:/General_Data
      - ${COMPOSE_PROJECT_DIR}/Backend/CustomNnUnetTrainer.py:/usr/local/lib/python3.10/dist-packages/nnunetv2/training/nnUNetTrainer/CustomNnUnetTrainer.py
      - ${COMPOSE_PROJECT_DIR}/Backend/alembic.ini:/alembic/alembic.ini
      - ${COMPOSE_PROJECT_DIR}/Backend/migrations:/alembic/migrations
      - ${COMPOSE_PROJECT_DIR}/Backend/voxtell_requirements.txt:/voxtell_requirements.txt
    command: >
        sh -c "
        pip install psycopg2-binary &&
        pip install -r /voxtell_requirements.txt &&
        pip install aiohttp &&
        alembic -c /alembic/alembic.ini upgrade head &&
        python /monailabel/server_start.py
        "
    depends_on:
      - postgres
      - orthanc
    restart: unless-stopped

  orthanc:
    image: jodogne/orthanc-plugins
    hostname: orthanc
    container_name: orthanc-backend
    ports:
      - 8043:8042
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/orthanc/lua:/etc/orthanc/lua
      - orthanc-db:/var/lib/orthanc/db/
    restart: unless-stopped

  postgres:
    image: postgres:18rc1-alpine3.22
    container_name: postgres-backend
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/backup.sql:/docker-entrypoint-initdb.d/backup.sql
      - postgres-db:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: password
    restart: unless-stopped

volumes:
  postgres-db:
  orthanc-db:
  nnUnet_folders:
  General_Data:
