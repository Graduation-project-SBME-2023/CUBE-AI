services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: monailabel:latest
    container_name: monailabel
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://workflow_user:password@postgres:5432/workflow_db
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
