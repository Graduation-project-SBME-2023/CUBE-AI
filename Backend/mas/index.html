<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MAS Orchestrator — WebSocket Chat</title>
  <style>
    body { font-family: Inter, system-ui, Arial; margin: 0; padding: 0; background:#0f172a; color:#e6eef8; display:flex; height:100vh; }
    .container { margin:auto; width:820px; max-width:96%; background:#071029; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.6); padding:20px; }
    h1 { margin:0 0 12px; font-size:18px; color:#cfe8ff; }
    .controls { display:flex; gap:8px; margin-bottom:12px; }
    textarea { flex:1; min-height:120px; border-radius:8px; padding:10px; border:1px solid #1f2937; background:#02101a; color:#e6eef8; resize:vertical; }
    button { padding:10px 14px; border-radius:8px; border:none; cursor:pointer; background:#0ea5a1; color:#012; font-weight:600; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .log { height:320px; overflow:auto; background:#041425; border-radius:8px; padding:12px; border:1px solid #0b2b3a; margin-bottom:12px; }
    .msg { margin-bottom:10px; padding:8px 10px; border-radius:8px; }
    .msg.system { background:#072233; color:#9bd7ff; }
    .msg.progress { background:#082a1f; color:#b7f3d6; }
    .msg.final { background:#1a1a2e; color:#d3d0ff; font-weight:600; }
    .status { font-size:13px; color:#9fb3c8; }
    .row { display:flex; gap:8px; }
    .small { font-size:12px; color:#9fb3c8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MAS Orchestrator — WebSocket Chat (streaming)</h1>
    <div class="small">Connection: <span id="conn-status">disconnected</span></div>
    <div class="log" id="log"></div>

    <div class="controls">
      <textarea id="hypothesis" placeholder="Write clinical hypothesis to send...">Give me a plan to investigate shortness of breath in a pediatric patient.</textarea>
      <div style="display:flex; flex-direction:column; gap:8px; width:140px;">
        <button id="connect">Connect</button>
        <button id="send" disabled>Send</button>
        <button id="clear">Clear</button>
      </div>
    </div>
    <div class="row">
      <input id="tools_doc" placeholder="Optional tools_doc (short)" style="flex:1; border-radius:6px; padding:8px; background:#02101a; border:1px solid #173044; color:#dfeefb" />
      <div style="width:140px;"></div>
    </div>
    <div class="status" id="status-line">Ready.</div>
  </div>

<script>
(() => {
  const WS_URL_DEFAULT = (location.protocol === "https:" ? "wss://" : "ws://") + location.hostname + ":8000/ws";
  // change above if server is on different host/port:
  const wsUrl = WS_URL_DEFAULT;

  let ws = null;
  const logEl = document.getElementById("log");
  const connStatus = document.getElementById("conn-status");
  const statusLine = document.getElementById("status-line");
  const connectBtn = document.getElementById("connect");
  const sendBtn = document.getElementById("send");
  const clearBtn = document.getElementById("clear");
  const hypothesisEl = document.getElementById("hypothesis");
  const toolsDocEl = document.getElementById("tools_doc");

  function appendMsg(kind, html) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    el.innerHTML = html;
    logEl.appendChild(el);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(s) {
    statusLine.textContent = s;
  }

  function setConnConnected() {
    connStatus.textContent = "connected";
    connStatus.style.color = "#a7f3d0";
    sendBtn.disabled = false;
    connectBtn.textContent = "Disconnect";
  }
  function setConnDisconnected() {
    connStatus.textContent = "disconnected";
    connStatus.style.color = "#fca5a5";
    sendBtn.disabled = true;
    connectBtn.textContent = "Connect";
  }

  connectBtn.addEventListener("click", async () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.close();
      return;
    }
    setStatus("Connecting to " + wsUrl + " ...");
    try {
      ws = new WebSocket(wsUrl);
    } catch (err) {
      appendMsg("system", "Failed to create WebSocket: " + err);
      setStatus("Failed to create WebSocket");
      return;
    }

    ws.addEventListener("open", () => {
      setConnConnected();
      setStatus("Connected. Type a hypothesis and press Send.");
      appendMsg("system", "WebSocket connected to server.");
    });

    ws.addEventListener("message", (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === "progress") {
          appendMsg("progress", "<strong>progress</strong>: " + escapeHtml(JSON.stringify(msg.payload)));
          setStatus("Receiving progress...");
        } else if (msg.type === "final") {
          appendMsg("final", "<strong>final</strong>: " + escapeHtml(JSON.stringify(msg.payload)));
          setStatus("Completed.");
        } else if (msg.type === "error") {
          appendMsg("system", "<strong>error</strong>: " + escapeHtml(JSON.stringify(msg.payload)));
          setStatus("Error received.");
        } else {
          appendMsg("system", "<strong>unknown</strong>: " + escapeHtml(JSON.stringify(msg)));
        }
      } catch (err) {
        appendMsg("system", "Non-json message: " + ev.data);
      }
    });

    ws.addEventListener("close", (ev) => {
      appendMsg("system", "WebSocket closed.");
      setConnDisconnected();
      setStatus("Disconnected.");
      ws = null;
    });

    ws.addEventListener("error", (ev) => {
      appendMsg("system", "WebSocket error.");
      setStatus("WebSocket error (see console).");
      console.error("ws error", ev);
    });
  });

  sendBtn.addEventListener("click", () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      appendMsg("system", "Not connected. Click Connect first.");
      return;
    }
    const hypothesis = hypothesisEl.value.trim();
    const tools_doc = toolsDocEl.value.trim();
    if (!hypothesis) {
      appendMsg("system", "Hypothesis is empty — nothing sent.");
      return;
    }
    const payload = { hypothesis, tools_doc };
    ws.send(JSON.stringify(payload));
    appendMsg("system", "Sent hypothesis. Waiting for updates...");
    setStatus("Waiting for server...");
  });

  clearBtn.addEventListener("click", () => {
    logEl.innerHTML = "";
  });

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // on load check if websocket is accessible (not auto connect)
  setConnDisconnected();
})();
</script>
</body>
</html>
