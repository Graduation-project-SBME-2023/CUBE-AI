<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAS Orchestrator Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .chat-container {
            width: 100%; max-width: 800px; height: 90vh;
            background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 20px; text-align: center;
        }
        .chat-header h1 { font-size: 24px; font-weight: 600; }
        .chat-header p { font-size: 14px; opacity: 0.9; margin-top: 5px; }
        .status-indicator {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
            background: #4ade80; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% {opacity:1;} 50% {opacity:0.5;} }
        .status-indicator.disconnected { background: #ef4444; }
        .messages-container { flex:1; overflow-y:auto; padding:20px; background:#f8fafc; }
        .message { margin-bottom:16px; display:flex; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
        .message.user { justify-content:flex-end; }
        .message-content { max-width:70%; padding:12px 16px; border-radius:16px; word-wrap:break-word; }
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color:white; border-bottom-right-radius:4px;
        }
        .message.assistant .message-content {
            background:white; color:#1e293b; border:1px solid #e2e8f0; border-bottom-left-radius:4px;
        }
        .message.system .message-content {
            background:#fef3c7; color:#92400e; border:1px solid #fde68a;
            max-width:100%; text-align:center; font-size:14px;
        }
        .loading { display:flex; gap:6px; padding:12px 16px; }
        .loading-dot { width:8px; height:8px; border-radius:50%; background:#667eea; animation:bounce 1.4s infinite ease-in-out both; }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
        .input-container { padding:20px; background:white; border-top:1px solid #e2e8f0; }
        .input-wrapper { display:flex; gap:12px; }
        #hypothesisInput { flex:1; padding:12px 16px; border:2px solid #e2e8f0; border-radius:12px; font-size:15px; outline:none; transition:border-color 0.3s; }
        #hypothesisInput:focus { border-color:#667eea; }
        #sendButton {
            padding:12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color:white; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer;
            transition:transform 0.2s, box-shadow 0.2s;
        }
        #sendButton:hover:not(:disabled) { transform: translateY(-2px); box-shadow:0 8px 20px rgba(102,126,234,0.4); }
        #sendButton:disabled { opacity:0.5; cursor:not-allowed; }
        .config-section { padding:12px 20px; background:#f1f5f9; border-bottom:1px solid #e2e8f0; }
        .config-section label { display:block; font-size:13px; color:#64748b; margin-bottom:6px; }
        .config-section input { width:100%; padding:8px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px; }
        pre { background:#1e293b; color:#e2e8f0; padding:12px; border-radius:8px; overflow-x:auto; font-size:13px; margin-top:8px; }
    </style>

    <!-- Include marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🧬 MAS Orchestrator</h1>
            <p><span class="status-indicator" id="statusDot"></span><span id="statusText">Connected</span></p>
        </div>

        <div class="config-section">
            <label for="apiUrl">API Endpoint:</label>
            <input type="text" id="apiUrl" value="http://localhost:8000/run" placeholder="http://localhost:8000/run">
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="message system">
                <div class="message-content">Welcome! Enter your clinical hypothesis to begin analysis.</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="hypothesisInput" placeholder="Enter your clinical hypothesis..." onkeypress="if(event.key==='Enter') sendHypothesis()">
                <button id="sendButton" onclick="sendHypothesis()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messagesContainer');
        const hypothesisInput = document.getElementById('hypothesisInput');
        const sendButton = document.getElementById('sendButton');
        const apiUrlInput = document.getElementById('apiUrl');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (typeof content === 'object' && content !== null) {
                if (content.markdown) {
                    contentDiv.innerHTML = marked.parse(content.markdown);
                } else {
                    contentDiv.innerHTML = `<pre>${escapeHtml(JSON.stringify(content, null, 2))}</pre>`;
                }
            } else if (typeof content === 'string') {
                if (content.includes('\n') || content.length > 240) {
                    contentDiv.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
                } else {
                    contentDiv.textContent = content;
                }
            } else {
                contentDiv.textContent = String(content);
            }

            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Also log to console
            console.log(`[${type}]`, content);
        }

        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loadingMessage';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content loading';
            contentDiv.innerHTML = `<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>`;
            
            loadingDiv.appendChild(contentDiv);
            messagesContainer.appendChild(loadingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeLoading() {
            const loading = document.getElementById('loadingMessage');
            if (loading) loading.remove();
        }

        function setStatus(connected) {
            if (connected) {
                statusDot.classList.remove('disconnected');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
            }
        }

        async function sendHypothesis() {
            const hypothesis = hypothesisInput.value.trim();
            if (!hypothesis) return;

            const apiUrl = apiUrlInput.value.trim();
            if (!apiUrl) { addMessage('system', 'Please enter an API endpoint URL'); return; }

            addMessage('user', hypothesis);
            hypothesisInput.value = '';
            sendButton.disabled = true;
            hypothesisInput.disabled = true;
            showLoading();

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hypothesis })
                });

                removeLoading();

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const result = await response.json();

                addMessage('assistant', result);
                console.log(result)

                if (result.planner_result) {
                    if (typeof result.planner_result === 'object' && result.planner_result.markdown) {
                        addMessage('assistant', { markdown: result.planner_result.markdown });
                    } else {
                        addMessage('assistant', { 'Planner Result': result.planner_result });
                    }
                }

                if (result.execution_state) addMessage('assistant', { 'Execution State': result.execution_state });
                if (result.system_state) addMessage('system', `System State: ${result.system_state}`);

                setStatus(true);
            } catch (error) {
                removeLoading();
                addMessage('system', `Error: ${error.message}`);
                setStatus(false);
                console.error('Error:', error);
            } finally {
                sendButton.disabled = false;
                hypothesisInput.disabled = false;
                hypothesisInput.focus();
            }
        }

        hypothesisInput.focus();
    </script>
</body>
</html>
