[pytest]
minversion = 8.0
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-config
    --strict-markers
    --tb=short
    -ra
markers =
    unit: deterministic test of one function, class, or module
    contract: validates a persisted or agent-to-agent data contract
    integration: exercises multiple backend components together
    pipeline: exercises pipeline graph construction or orchestration
    e2e: exercises the deployed backend workflow end to end
    docker: requires Docker services
    live_llm: contacts a real language model
    gpu: requires a CUDA-capable GPU
    slow: takes materially longer than the unit suite
    regression: consolidated pre-existing backend regression test
    radiology: requires the MONAI/PyTorch radiology runtime
    legacy_autogen: tests the AutoGen pipeline the toolkit replaces; outside the deterministic gate
    sandbox: requires the tool sandbox runner
    celery: requires Redis and a Celery compute worker
