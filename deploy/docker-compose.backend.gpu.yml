name: CUBE.AI
services:
  agents:
    image: cubeai1/agents-app:latest
    container_name: agents-backend
    ports:
      - "8150:8150"
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/storage:/storage
      - ${COMPOSE_PROJECT_DIR}/Backend/storage_paths.py:/app/Backend/storage_paths.py:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/storage_write_guard.py:/app/Backend/storage_write_guard.py:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/agent_system:/app/Backend/agent_system
      - ${COMPOSE_PROJECT_DIR}/Backend/mcp:/app/Backend/mcp
      - ${COMPOSE_PROJECT_DIR}/Backend/apps/radiology/lib/configs:/app/Backend/apps/radiology/lib/configs:ro
    environment:
      PYTHONPATH: /app/Backend
      BACKEND_STORAGE_ROOT: /storage
      AGENTS_WORKSPACE_DIR: /storage/hypotheses
      GENERAL_DATA_DIR: /storage/data/medical
      NNUNET_DIR: /storage/data/nnunet
      nnUnet_folders: /storage/data/nnunet
      MODELS_DIR: /storage/models
      INFERENCE_JOB_DIR: /storage/jobs/inference
      HF_HOME: /storage/cache/huggingface
      BACKEND_TEMP_DIR: /storage/temp
      BACKEND_LOG_DIR: /storage/logs
      TMPDIR: /storage/temp/radiology
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      APP_API_URL: http://application-api:8001
      INFERENCE_API_URL: http://monailabel:8000
      AGENTS_API_URL: http://agents:8150
      MONAI_URL: http://monailabel:8000
      CONTROL_API_URL: http://application-api:8001
      ORTHANC_URL: http://orthanc:8042
    env_file:
      - .env
    depends_on:
      application-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", 'import urllib.request; urllib.request.urlopen("http://localhost:8150/client-config", timeout=3)' ]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 180s
    restart: unless-stopped

  db-migrate:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: deploy/Dockerfile.application-api
    image: cubeai1/application-api:v1.0
    # This image is built from the current checkout. Reusing an older local tag can
    # omit newly added migration files such as application_api/alembic.ini.
    pull_policy: build
    command: alembic -c /app/application_api/alembic.ini upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-seed:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: deploy/Dockerfile.application-api
    image: cubeai1/application-api:v1.0
    pull_policy: build
    command: python -m application_api.seeders
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
    env_file:
      - .env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  application-api:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: deploy/Dockerfile.application-api
    image: cubeai1/application-api:v1.0
    pull_policy: build
    container_name: application-api-backend
    ports:
      - "8001:8001"
    networks:
      default:
        aliases:
          - control-api
    environment:
      APP_API_PORT: 8001
      APP_API_WORKERS: 2
      APP_API_URL: http://application-api:8001
      INFERENCE_API_URL: http://monailabel:8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      DB_POOL_TIMEOUT: 10
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
      ORTHANC_WEBHOOK_TOKEN: ${ORTHANC_WEBHOOK_TOKEN:-}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
      BACKEND_STORAGE_ROOT: /storage
      AGENTS_WORKSPACE_DIR: /storage/hypotheses
      GENERAL_DATA_DIR: /storage/data/medical
      NNUNET_DIR: /storage/data/nnunet
      nnUnet_folders: /storage/data/nnunet
      MODELS_DIR: /storage/models
      INFERENCE_JOB_DIR: /storage/jobs/inference
      HF_HOME: /storage/cache/huggingface
      BACKEND_TEMP_DIR: /storage/temp
      BACKEND_LOG_DIR: /storage/logs
      TMPDIR: /storage/temp/radiology
    env_file:
      - .env
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/storage:/storage
      - ${COMPOSE_PROJECT_DIR}/Backend/apps/radiology/lib/configs:/app/apps/radiology/lib/configs:ro
    depends_on:
      db-seed:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", 'import urllib.request; urllib.request.urlopen("http://localhost:8001/health", timeout=3)' ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  monailabel:
    # GPU image — amd64 only, CUDA toolkit included
    image: cubeai1/custom-monailabel:v1.0-gpu
    # Override the image's stale baked CMD (it still runs `alembic ... upgrade head`
    # against a /alembic mount this branch removed — DB migrations are now owned by
    # the one-shot db-migrate service). Mirrors deploy/Dockerfile.backend.gpu CMD.
    command:
      - sh
      - -c
      - if [ ! -s "$$VOXTELL_DIR/text_embeddings_cache.pkl" ]; then python /apps/radiology/scripts/build_voxtell_cache.py; fi && python /monailabel/server_start.py
    container_name: monailabel-backend
    runtime: nvidia
    shm_size: 8G
    ports:
      - "8000:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MONAI_SERVER_PORT: 8000
      APP_API_URL: http://application-api:8001
      INFERENCE_API_URL: http://monailabel:8000
      INFERENCE_MAX_CONCURRENCY: 1
      INFERENCE_QUEUE_CAPACITY: 8
      MONAI_LABEL_APP_DIR: /apps/radiology
      MONAI_LABEL_APP_CONF: |
        {"models": "all"}
      MONAI_LABEL_STUDIES: http://orthanc:8042/dicom-web
      ORTHANC_URL: http://orthanc:8042
      BACKEND_STORAGE_ROOT: /storage
      AGENTS_WORKSPACE_DIR: /storage/hypotheses
      GENERAL_DATA_DIR: /storage/data/medical
      NNUNET_DIR: /storage/data/nnunet
      nnUnet_folders: /storage/data/nnunet
      MODELS_DIR: /storage/models
      INFERENCE_JOB_DIR: /storage/jobs/inference
      HF_HOME: /storage/cache/huggingface
      BACKEND_TEMP_DIR: /storage/temp
      BACKEND_LOG_DIR: /storage/logs
      TMPDIR: /storage/temp/radiology
      TEXT_MODEL_PATH: /storage/models/qwen3-4b-embedding
      VOXTELL_DIR: /storage/models/voxtell_v1.1
      VISTA_CONFIG_SOURCE_DIR: /config/vista
      nnUNet_raw: /storage/data/nnunet/nnUNet_raw
      nnUNet_preprocessed: /storage/data/nnunet/nnUNet_preprocessed
      nnUNet_results: /storage/data/nnunet/nnUNet_results
      TORCH_CUDA_ARCH_LIST: "12.0"
    env_file:
      - .env
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/apps:/apps
      - ${COMPOSE_PROJECT_DIR}/Backend/monailabel:/monailabel
      - ${COMPOSE_PROJECT_DIR}/Backend/storage:/storage
      - ${COMPOSE_PROJECT_DIR}/Backend/apps/radiology/vista3d/configs:/config/vista:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/storage_paths.py:/monailabel/storage_paths.py:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/apps/radiology/lib/trainers/CustomNnUnetTrainer.py:/usr/local/lib/python3.10/dist-packages/nnunetv2/training/nnUNetTrainer/CustomNnUnetTrainer.py:ro
    depends_on:
      orthanc:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", 'import urllib.request; urllib.request.urlopen("http://localhost:8000/info/", timeout=3)' ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 3600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              device_ids: [ "0" ] # RTX 3060 — adjust as needed
    restart: unless-stopped

  orthanc:
    image: jodogne/orthanc-plugins:1.12.10
    hostname: orthanc
    container_name: orthanc-backend
    ports:
      - 8043:8042
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/orthanc/lua:/etc/orthanc/lua:ro
      # Same volume name as docker-compose.backend.cpu.yml: previously this
      # was orthanc-db2, a DIFFERENT named volume than the CPU stack, so
      # switching between CPU and GPU profiles silently presented an empty
      # PACS archive instead of the same data.
      - orthanc-db:/var/lib/orthanc/db/
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres-backend
    volumes:
      - ${COMPOSE_PROJECT_DIR}/deploy/database/backup.sql:/docker-entrypoint-initdb.d/backup.sql
      # Same volume name as docker-compose.backend.cpu.yml (see the orthanc
      # comment above for why this must match, not use a "-2" suffix).
      # PostgreSQL 18 stores clusters below a major-version directory (for
      # example /var/lib/postgresql/18/docker). Mount the parent directory so
      # that layout survives container recreation and supports pg_upgrade.
      - postgres-db:/var/lib/postgresql
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot readiness announcer. Unlike Uvicorn's worker-level messages, this
  # runs once only after every backend dependency is usable. Frontend compose
  # files can extend its dependency list with their own services.
  startup-complete:
    image: cubeai1/application-api:v1.0
    pull_policy: never
    command:
      - python
      - -c
      - |
        g='\033[92m'; b='\033[1m'; c='\033[96m'; r='\033[0m'; line='━'*52
        print(f'\n{g}{b}┏{line}┓{r}')
        print(f'{g}{b}┃{"  🚀  CUBE.AI  —  Backend Stack Ready  🚀  ":^52}┃{r}')
        print(f'{g}{b}┣{line}┫{r}')
        print(f'{g}┃  {c}✔  Postgres         {g}healthy{" "*24}┃{r}')
        print(f'{g}┃  {c}✔  Orthanc          {g}started{" "*24}┃{r}')
        print(f'{g}┃  {c}✔  Application API  {g}healthy{" "*24}┃{r}')
        print(f'{g}┃  {c}✔  MonaiLabel       {g}healthy{" "*24}┃{r}')
        print(f'{g}┃  {c}✔  Agents           {g}healthy{" "*24}┃{r}')
        print(f'{g}{b}┗{line}┛{r}\n')

    depends_on:
      agents:
        condition: service_healthy
      application-api:
        condition: service_healthy
      monailabel:
        condition: service_healthy
      orthanc:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-db:
  orthanc-db:
