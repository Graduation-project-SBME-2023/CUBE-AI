name: CUBE.AI
services:
  agents:
    image: cubeai1/agents-app:latest
    container_name: agents-backend
    ports:
      - "8150:8150"
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/storage:/storage
      - ${COMPOSE_PROJECT_DIR}/Backend/storage_paths.py:/app/Backend/storage_paths.py:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/agent_system:/app/Backend/agent_system
      - ${COMPOSE_PROJECT_DIR}/Backend/mcp:/app/Backend/mcp
      - ${COMPOSE_PROJECT_DIR}/Backend/apps/radiology/lib/configs:/app/Backend/apps/radiology/lib/configs:ro
    environment:
      PYTHONPATH: /app/Backend
      BACKEND_STORAGE_ROOT: /storage
      AGENTS_WORKSPACE_DIR: /storage/hypotheses
      GENERAL_DATA_DIR: /storage/data/medical
      NNUNET_DIR: /storage/data/nnunet
      nnUnet_folders: /storage/data/nnunet
      MODELS_DIR: /storage/models
      INFERENCE_JOB_DIR: /storage/jobs/inference
      HF_HOME: /storage/cache/huggingface
      BACKEND_TEMP_DIR: /storage/temp
      BACKEND_LOG_DIR: /storage/logs
      TMPDIR: /storage/temp/radiology
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      APP_API_URL: http://application-api:8001
      INFERENCE_API_URL: http://monailabel:8000
      AGENTS_API_URL: http://agents:8150
      MONAI_URL: http://monailabel:8000
      CONTROL_API_URL: http://application-api:8001
      ORTHANC_URL: http://orthanc:8042
      PIPELINE_MAX_CONCURRENCY: ${PIPELINE_MAX_CONCURRENCY:-4}
      PIPELINE_QUEUE_CAPACITY: ${PIPELINE_QUEUE_CAPACITY:-8}
      PLANNING_MAX_CONCURRENCY: ${PLANNING_MAX_CONCURRENCY:-2}
      PLANNING_QUEUE_CAPACITY: ${PLANNING_QUEUE_CAPACITY:-16}
      RESOURCE_GPU_SEGMENTATION_CAPACITY: ${RESOURCE_GPU_SEGMENTATION_CAPACITY:-1}
      RESOURCE_CPU_HEAVY_CAPACITY: ${RESOURCE_CPU_HEAVY_CAPACITY:-1}
      RESOURCE_WAIT_QUEUE_CAPACITY: ${RESOURCE_WAIT_QUEUE_CAPACITY:-32}
      OMP_NUM_THREADS: ${CPU_HEAVY_THREADS:-4}
      MKL_NUM_THREADS: ${CPU_HEAVY_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${CPU_HEAVY_THREADS:-4}
      NUMEXPR_NUM_THREADS: ${CPU_HEAVY_THREADS:-4}
      WS_INPUT_QUEUE_SIZE: ${WS_INPUT_QUEUE_SIZE:-32}
      WS_OUTBOUND_QUEUE_SIZE: ${WS_OUTBOUND_QUEUE_SIZE:-256}
      WS_CLIENT_MESSAGE_HISTORY: ${WS_CLIENT_MESSAGE_HISTORY:-1024}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-256}
      WS_MAX_CONNECTIONS_PER_SESSION: ${WS_MAX_CONNECTIONS_PER_SESSION:-8}
      WS_MAX_MESSAGE_BYTES: ${WS_MAX_MESSAGE_BYTES:-65536}
      WS_SESSION_IDLE_TTL_SECONDS: ${WS_SESSION_IDLE_TTL_SECONDS:-3600}
    env_file:
      - .env
    depends_on:
      application-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          'import urllib.request; urllib.request.urlopen("http://localhost:8150/client-config", timeout=3)',
        ]
      interval: 5s
      timeout: 4s
      retries: 24
      # The agents process can take over two minutes to import its AI stack on a
      # cold start. Do not fail dependent services while it is still loading.
      start_period: 180s
    restart: unless-stopped

  db-migrate:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: deploy/Dockerfile.application-api
    image: cubeai1/application-api:v1.0
    pull_policy: build
    command: alembic -c /app/application_api/alembic.ini upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-seed:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: deploy/Dockerfile.application-api
    image: cubeai1/application-api:v1.0
    pull_policy: build
    command: python -m application_api.seeders
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
    env_file:
      - .env
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: "no"

  application-api:
    build:
      context: ${COMPOSE_PROJECT_DIR}
      dockerfile: deploy/Dockerfile.application-api
    image: cubeai1/application-api:v1.0
    pull_policy: build
    container_name: application-api-backend
    ports:
      - "8001:8001"
    networks:
      default:
        aliases:
          - control-api
    environment:
      APP_API_PORT: 8001
      APP_API_WORKERS: 2
      APP_API_URL: http://application-api:8001
      INFERENCE_API_URL: http://monailabel:8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
      DB_POOL_TIMEOUT: 10
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: ${ORTHANC_USER:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
      ORTHANC_WEBHOOK_TOKEN: ${ORTHANC_WEBHOOK_TOKEN:-}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
      BACKEND_STORAGE_ROOT: /storage
      AGENTS_WORKSPACE_DIR: /storage/hypotheses
      GENERAL_DATA_DIR: /storage/data/medical
      NNUNET_DIR: /storage/data/nnunet
      nnUnet_folders: /storage/data/nnunet
      MODELS_DIR: /storage/models
      INFERENCE_JOB_DIR: /storage/jobs/inference
      HF_HOME: /storage/cache/huggingface
      BACKEND_TEMP_DIR: /storage/temp
      BACKEND_LOG_DIR: /storage/logs
      TMPDIR: /storage/temp/radiology
    env_file:
      - .env
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/storage:/storage
      - ${COMPOSE_PROJECT_DIR}/Backend/apps/radiology/lib/configs:/app/apps/radiology/lib/configs:ro
    depends_on:
      db-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          'import urllib.request; urllib.request.urlopen("http://localhost:8001/health", timeout=3)',
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  monailabel:
    # CPU image — multi-arch (arm64 + amd64), no CUDA
    image: cubeai1/custom-monailabel:v1.0-cpu
    # Override the image's stale baked CMD (it still runs `alembic ... upgrade head`
    # against a /alembic mount this branch removed — DB migrations are now owned by
    # the one-shot db-migrate service). Mirrors deploy/Dockerfile.backend.cpu CMD.
    command:
      - sh
      - -c
      - if [ ! -s "$$VOXTELL_DIR/text_embeddings_cache.pkl" ]; then python /apps/radiology/scripts/build_voxtell_cache.py; fi && python /monailabel/server_start.py
    container_name: monailabel-backend
    shm_size: 8G
    ports:
      - "8000:8000"
    environment:
      MONAI_LABEL_APP_DIR: /apps/radiology
      MONAI_LABEL_APP_CONF: |
        {"models": "all"}
      MONAI_SERVER_PORT: 8000
      APP_API_URL: http://application-api:8001
      INFERENCE_API_URL: http://monailabel:8000
      INFERENCE_MAX_CONCURRENCY: 1
      INFERENCE_QUEUE_CAPACITY: 8
      MONAI_LABEL_STUDIES: http://orthanc:8042/dicom-web
      ORTHANC_URL: http://orthanc:8042
      BACKEND_STORAGE_ROOT: /storage
      AGENTS_WORKSPACE_DIR: /storage/hypotheses
      GENERAL_DATA_DIR: /storage/data/medical
      NNUNET_DIR: /storage/data/nnunet
      nnUnet_folders: /storage/data/nnunet
      MODELS_DIR: /storage/models
      INFERENCE_JOB_DIR: /storage/jobs/inference
      HF_HOME: /storage/cache/huggingface
      BACKEND_TEMP_DIR: /storage/temp
      BACKEND_LOG_DIR: /storage/logs
      TMPDIR: /storage/temp/radiology
      TEXT_MODEL_PATH: /storage/models/qwen3-4b-embedding
      VOXTELL_DIR: /storage/models/voxtell_v1.1
      OMP_NUM_THREADS: ${VOXTELL_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${VOXTELL_CPU_THREADS:-4}
      OPENBLAS_NUM_THREADS: ${VOXTELL_CPU_THREADS:-4}
      NUMEXPR_NUM_THREADS: ${VOXTELL_CPU_THREADS:-4}
      VISTA_CONFIG_SOURCE_DIR: /config/vista
      nnUNet_raw: /storage/data/nnunet/nnUNet_raw
      nnUNet_preprocessed: /storage/data/nnunet/nnUNet_preprocessed
      nnUNet_results: /storage/data/nnunet/nnUNet_results
      PATH: "/apps/radiology/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    env_file:
      - .env
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/apps:/apps
      - ${COMPOSE_PROJECT_DIR}/Backend/monailabel:/monailabel
      - ${COMPOSE_PROJECT_DIR}/Backend/storage:/storage
      - ${COMPOSE_PROJECT_DIR}/Backend/apps/radiology/vista3d/configs:/config/vista:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/storage_paths.py:/apps/radiology/storage_paths.py:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/apps/radiology/lib/trainers/CustomNnUnetTrainer.py:/usr/local/lib/python3.10/dist-packages/nnunetv2/training/nnUNetTrainer/CustomNnUnetTrainer.py:ro
    depends_on:
      orthanc:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          'import urllib.request; urllib.request.urlopen("http://localhost:8000/info/", timeout=3)',
        ]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  orthanc:
    image: jodogne/orthanc-plugins:1.12.10
    hostname: orthanc
    container_name: orthanc-backend
    ports:
      - 8043:8042
    volumes:
      - ${COMPOSE_PROJECT_DIR}/Backend/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ${COMPOSE_PROJECT_DIR}/Backend/orthanc/lua:/etc/orthanc/lua
      - orthanc-db:/var/lib/orthanc/db/
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres-backend
    volumes:
      - ${COMPOSE_PROJECT_DIR}/deploy/database/backup.sql:/docker-entrypoint-initdb.d/backup.sql
      - postgres-db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot readiness announcer. Unlike Uvicorn's worker-level messages, this
  # runs once only after every backend dependency is usable. Frontend compose
  # files can extend its dependency list with their own services.
  startup-complete:
    image: cubeai1/application-api:v1.0
    pull_policy: never
    command:
      - python
      - -c
      - 'print("Application startup complete. All containers are ready.", flush=True)'
    depends_on:
      agents:
        condition: service_healthy
      application-api:
        condition: service_healthy
      monailabel:
        condition: service_healthy
      orthanc:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-db:
  orthanc-db:
