# Not used, react app runs super slow on docker

services:
  frontend:
    build:
      context: ../Frontend/OHIF-Viewer
      dockerfile: ../../deploy/Dockerfile.frontend.dev
    container_name: ohif-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount the full monorepo for live reload
      - ../Frontend/OHIF-Viewer:/usr/src/viewers:cached
      - ohif-node-modules:/usr/src/viewers/node_modules
    environment:
      - NODE_ENV=development
    command: yarn run dev

volumes:
  ohif-node-modules:
