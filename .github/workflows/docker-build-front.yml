name: Build & Push Frontend Image

on:
  push:
    branches:
      - Release-Version

jobs:
  build-and-push:
    name: Build & Push Multi-Platform Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU lets the runner emulate arm64 so buildx can compile for it
#      - name: Set up QEMU
#        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CUBE_AI_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CUBE_AI_DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend/OHIF-Viewer
          file: ./Frontend/OHIF-Viewer/Dockerfile.prod
          platforms: linux/amd64  # ,linux/arm64
          push: true
          tags: |
            ${{ secrets.CUBE_AI_DOCKERHUB_USERNAME }}/webapp:latest
            ${{ secrets.CUBE_AI_DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}
          # Layer cache speeds up repeat builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max