name: Backend storage boundary

# Every push to any branch; a PR shows the check of its head commit.
on:
  push:

jobs:
  check-storage-boundary:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Reject runtime data outside Backend/storage
        shell: pwsh
        run: ./Backend/scripts/check_storage_boundary.ps1
