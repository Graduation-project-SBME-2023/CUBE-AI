name: Build and Push Multi-Platform Agents Docker Image

on:
  push:
    branches:
      - deployment

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CUBE_AI_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CUBE_AI_DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Backend/agent_system/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.CUBE_AI_DOCKERHUB_USERNAME }}/agents-app:latest
            ${{ secrets.CUBE_AI_DOCKERHUB_USERNAME }}/agents-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
