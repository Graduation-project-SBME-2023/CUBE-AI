# ============================================================
# .github/workflows/docker-build-monai.yml
#
# Builds the GPU MONAI Label image (amd64 only — CUDA images
# don't support arm64 natively). The CPU variant has been
# retired; this stack is GPU-only. Registries and tags are
# decided by build-image.yml:
#
#   ghcr.io/<owner>/custom-monailabel:<sha>-gpu, :<branch>-gpu   every build
#   cubeai1/custom-monailabel:latest-gpu                          LATEST_BRANCH
#   cubeai1/custom-monailabel:v1.2.3-gpu                          tag v1.2.3
#   cubeai1/custom-monailabel:<input>-gpu                         manual run
#
# Triggers
# --------
#   • Push to any branch that touches the image's inputs
#   • Version tags  v*.*.*
#   • Manual trigger (workflow_dispatch) with optional custom tag
#
# Required secrets (Settings → Secrets → Actions)
# ------------------------------------------------
#   CUBE_AI_DOCKERHUB_USERNAME   your Docker Hub username
#   CUBE_AI_DOCKERHUB_TOKEN      Docker Hub access token (not password)
# ============================================================

name: Build & Push MONAI Docker Images

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - "Backend/apps/radiology/**"
      - "Backend/requirements/voxtell.txt"
      - "Backend/storage_paths.py"
      - "deploy/Dockerfile.backend.gpu"
      - ".github/workflows/docker-build-monai.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom Docker Hub tag (default: manual)"
        required: false
        default: "manual"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-gpu:
    name: Build GPU image (amd64)
    uses: ./.github/workflows/build-image.yml
    with:
      image: custom-monailabel
      dockerhub-image: cubeai1/custom-monailabel
      context: ./Backend
      dockerfile: ./deploy/Dockerfile.backend.gpu
      tag-suffix: -gpu
      extra-tag: ${{ github.event.inputs.tag }}
      free-disk-space: true
    secrets: inherit
